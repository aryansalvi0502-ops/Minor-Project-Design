services:
  - type: web
    name: udaan-early-warning-api
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://minor-project-design.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: udaan-early-warning-db
          property: connectionString

databases:
  - name: udaan-early-warning-db
    databaseName: udaan_db
    user: udaan_user
    plan: free
